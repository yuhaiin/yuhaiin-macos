<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <!-- macOS app icon built from upstream yuhaiin branding/packet-rhythm.svg.
       Follows the macOS icon grid: 824×824 body centred on a 1024 canvas. -->
  <title id="title">Yuhaiin</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFAF7"/>
      <stop offset="1" stop-color="#FFE8DF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E9C9BC" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="dotShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- drop shadow -->
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#5A3A30" opacity="0.28" filter="url(#shadow)"/>
  <!-- body -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <!-- packet rhythm mark (upstream 256-unit artwork, scaled) -->
  <g transform="translate(512 512) scale(3.6) translate(-128 -128)">
    <path d="M47 128h162" fill="none" stroke="#455A9A" stroke-width="7" stroke-linecap="round"/>
    <g opacity="0.22" filter="url(#dotShadow)" transform="translate(0 2.5)">
      <circle cx="56" cy="128" r="11"/>
      <circle cx="92" cy="128" r="14"/>
      <circle cx="128" cy="128" r="18"/>
      <circle cx="164" cy="128" r="14"/>
      <circle cx="200" cy="128" r="11"/>
    </g>
    <circle cx="56" cy="128" r="9" fill="#E57969" stroke="#FFF9F6" stroke-width="4"/>
    <circle cx="92" cy="128" r="12" fill="#F0BC58" stroke="#FFF9F6" stroke-width="4"/>
    <circle cx="128" cy="128" r="16" fill="#526FC5" stroke="#FFF9F6" stroke-width="4"/>
    <circle cx="164" cy="128" r="12" fill="#55AFA5" stroke="#FFF9F6" stroke-width="4"/>
    <circle cx="200" cy="128" r="9" fill="#D66C91" stroke="#FFF9F6" stroke-width="4"/>
  </g>
</svg>
